; ============================================================================
; Compass Navigation Overhaul VR - user settings
;
; Load order, lowest to highest priority:
;   1. Data\MCM\Config\Compass Navigation Overhaul VR\settings.ini
;   2. Data\SKSE\Plugins\CompassNavigationOverhaulVR.ini
;   3. Data\MCM\Settings\Compass Navigation Overhaul VR.ini
;
; Edit this file when the MCM is not installed. When the MCM is installed,
; change settings in the menu because its generated file has highest priority.
; Removing or commenting out a key restores the packaged default.
;
; Changes are hot-reloaded after any game menu is opened and closed.
; Key prefixes indicate the value type: b=boolean, u=unsigned integer, f=float.
; ============================================================================

[Debug]
; 0=trace, 1=debug, 2=info, 3=warn, 4=error, 5=critical, 6=off
; Log: Documents\My Games\Skyrim VR\SKSE\CompassNavigationOverhaulVR.log
uLogLevel=2

[Display]
; 1=metric, 0=imperial
bUseMetricUnits=1

; 0=hidden, 1=unknown marker, 2=normal marker
uUndiscoveredLocationMarkers=0

bShowUndiscoveredLocationInfo=0
bShowEnemyMarkers=1
bShowEnemyNameUnderMarker=1

; 1=objective text, 0=location name
bShowObjectiveAsTarget=1
bShowOtherObjectivesCount=1
bShowInteriorMarkers=1

; Focus cone angles in degrees; the keep angle should exceed the show angle.
fAngleToShowMarkerDetails=10
fAngleToKeepMarkerDetailsShown=35

; Delay before focused marker details appear, in seconds.
fFocusingDelayToShow=0.1

[QuestList]
; Top-left position and maximum height as proportions of the movie dimensions.
fPositionX=0.008
fPositionY=0.125
fMaxHeight=0.675

bShowInExteriors=1
bShowInInteriors=1
bHideInCombat=0
