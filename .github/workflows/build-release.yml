name: Build + Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified artifacts (version from vcpkg.json)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
  release:
    if: inputs.publish
    needs: build
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      run-id: ${{ github.run_id }}
      active-build: true
